name: OCI A1 Hunter

on:
  workflow_dispatch:

  schedule:
    # GitHub позволяет минимум раз в 5 минут
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: oci-a1-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}

      INSTANCE_NAME: designos-a1
      SHAPE: VM.Standard.A1.Flex

    steps:
      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$HOME/oci-cli"
          "$HOME/oci-cli/bin/pip" install --quiet --upgrade pip
          "$HOME/oci-cli/bin/pip" install --quiet oci-cli

          echo "$HOME/oci-cli/bin" >> "$GITHUB_PATH"

      - name: Configure OCI
        shell: bash
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.oci"
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" \
            > "$HOME/.ssh/oci_authorized_keys"

          chmod 600 "$HOME/.ssh/oci_authorized_keys"

      - name: Test OCI authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking OCI API authentication..."

          oci iam region-subscription list \
            --config-file "$HOME/.oci/config" \
            >/dev/null

          echo "OCI authentication OK"

      - name: Hunt Ampere A1
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================"
          echo "OCI A1 HUNTER"
          echo "Region: $OCI_REGION"
          echo "Target: $SHAPE"
          echo "Primary:  2 OCPU / 12 GB"
          echo "Fallback: 1 OCPU / 6 GB"
          echo "========================================"

          # -----------------------------------------
          # Prevent creating duplicate instances
          # -----------------------------------------

          EXISTING=$(
            oci compute instance list \
              --config-file "$HOME/.oci/config" \
              --region "$OCI_REGION" \
              --compartment-id "$OCI_COMPARTMENT_OCID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json 2>/dev/null |
            jq -r '
              .data[]
              | select(."lifecycle-state" != "TERMINATED")
              | .id
            ' |
            head -n 1
          )

          if [ -n "$EXISTING" ]; then
            echo "✅ A1 already exists:"
            echo "$EXISTING"
            exit 0
          fi

          # -----------------------------------------
          # Find latest Ubuntu ARM image
          # -----------------------------------------

          echo "Finding Ubuntu ARM image..."

          IMAGE_ID=$(
            oci compute image list \
              --config-file "$HOME/.oci/config" \
              --region "$OCI_REGION" \
              --compartment-id "$OCI_COMPARTMENT_OCID" \
              --shape "$SHAPE" \
              --operating-system "Canonical Ubuntu" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --all \
              --output json |
            jq -r '
              [
                .data[]
                | select(."lifecycle-state" == "AVAILABLE")
              ][0].id
            '
          )

          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "null" ]; then
            echo "❌ Could not find compatible Ubuntu image."
            exit 1
          fi

          echo "Image found: $IMAGE_ID"

          # -----------------------------------------
          # Get all Availability Domains
          # -----------------------------------------

          mapfile -t ADS < <(
            oci iam availability-domain list \
              --config-file "$HOME/.oci/config" \
              --region "$OCI_REGION" \
              --compartment-id "$OCI_COMPARTMENT_OCID" \
              --output json |
            jq -r '.data[].name'
          )

          if [ "${#ADS[@]}" -eq 0 ]; then
            echo "❌ No Availability Domains found."
            exit 1
          fi

          echo
          echo "Availability Domains:"

          for AD in "${ADS[@]}"; do
            echo "  - $AD"
          done

          # -----------------------------------------
          # Configurations
          # -----------------------------------------

          CONFIGS=(
            "2:12"
            "1:6"
          )

          # -----------------------------------------
          # Try every AD
          # -----------------------------------------

          for CONFIG in "${CONFIGS[@]}"; do

            IFS=: read -r OCPUS MEMORY <<< "$CONFIG"

            for AD in "${ADS[@]}"; do

              echo
              echo "----------------------------------------"
              echo "Trying:"
              echo "$AD"
              echo "${OCPUS} OCPU / ${MEMORY} GB"
              echo "----------------------------------------"

              OUTPUT_FILE=$(mktemp)

              oci compute instance launch \
                --config-file "$HOME/.oci/config" \
                --region "$OCI_REGION" \
                --availability-domain "$AD" \
                --compartment-id "$OCI_COMPARTMENT_OCID" \
                --subnet-id "$OCI_SUBNET_OCID" \
                --shape "$SHAPE" \
                --shape-config "{\"ocpus\":${OCPUS},\"memoryInGBs\":${MEMORY}}" \
                --display-name "$INSTANCE_NAME" \
                --image-id "$IMAGE_ID" \
                --ssh-authorized-keys-file "$HOME/.ssh/oci_authorized_keys" \
                --assign-public-ip true \
                --boot-volume-size-in-gbs 50 \
                --wait-for-state RUNNING \
                --wait-interval-seconds 15 \
                --no-retry \
                --output json \
                > "$OUTPUT_FILE" 2>&1

              EXIT_CODE=$?

              # -------------------------------------
              # SUCCESS
              # -------------------------------------

              if [ "$EXIT_CODE" -eq 0 ]; then

                INSTANCE_ID=$(
                  jq -r '.data.id // empty' \
                    "$OUTPUT_FILE" 2>/dev/null
                )

                echo
                echo "========================================"
                echo "🔥🔥🔥 A1 FOUND AND CREATED 🔥🔥🔥"
                echo
                echo "Availability Domain:"
                echo "$AD"
                echo
                echo "Configuration:"
                echo "${OCPUS} OCPU / ${MEMORY} GB"
                echo
                echo "Instance:"
                echo "$INSTANCE_ID"
                echo "========================================"

                rm -f "$OUTPUT_FILE"

                exit 0
              fi

              ERROR_TEXT=$(cat "$OUTPUT_FILE")
              rm -f "$OUTPUT_FILE"

              # -------------------------------------
              # NORMAL CAPACITY FAILURE
              # -------------------------------------

              if echo "$ERROR_TEXT" | \
                grep -Eqi \
                "Out of host capacity|OutOfHostCapacity|out of capacity"; then

                echo "No capacity."
                continue
              fi

              # -------------------------------------
              # SERVICE LIMIT
              # -------------------------------------

              if echo "$ERROR_TEXT" | \
                grep -Eqi \
                "LimitExceeded|QuotaExceeded|ServiceLimit"; then

                echo "❌ OCI service/quota limit:"
                echo "$ERROR_TEXT"
                exit 1
              fi

              # -------------------------------------
              # AUTH / CONFIG ERROR
              # -------------------------------------

              if echo "$ERROR_TEXT" | \
                grep -Eqi \
                "NotAuthenticated|NotAuthorized|InvalidParameter|InvalidKey|NotFound"; then

                echo "❌ OCI configuration/authentication error:"
                echo "$ERROR_TEXT"
                exit 1
              fi

              echo "Other OCI response:"
              echo "$ERROR_TEXT" | tail -n 20

            done
          done

          echo
          echo "========================================"
          echo "No A1 capacity right now."
          echo "GitHub will retry automatically."
          echo "========================================"

          exit 0
