name: OCI A1 Hunter

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions использует UTC.
    # Запрос на запуск каждые 5 минут.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: oci-a1-hunter
  cancel-in-progress: false

jobs:
  hunt:
    name: Hunt Oracle A1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # ============================================================
      # OCI
      # ============================================================
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}

      # Поддерживает оба названия секрета
      SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY || secrets.SSH_PUBLIC_KEY }}

      # ============================================================
      # INSTANCE
      # ============================================================
      INSTANCE_NAME: designos-a1
      SHAPE: VM.Standard.A1.Flex

      # ============================================================
      # TELEGRAM — необязательно
      # Если секретов нет, hunter просто пропустит уведомление.
      # ============================================================
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # ============================================================
      # 1. INSTALL OCI CLI
      # ============================================================
      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing OCI CLI..."

          curl -fsSL \
            https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            -o /tmp/install_oci.sh

          bash /tmp/install_oci.sh \
            --accept-all-defaults \
            --install-dir "$HOME/lib/oracle-cli" \
            --exec-dir "$HOME/bin"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/oci" --version

      # ============================================================
      # 2. OCI CONFIG
      # ============================================================
      - name: Configure OCI
        shell: bash
        run: |
          set -euo pipefail

          # Проверяем обязательные secrets
          REQUIRED_VARS=(
            OCI_TENANCY_OCID
            OCI_USER_OCID
            OCI_FINGERPRINT
            OCI_PRIVATE_KEY
            OCI_REGION
            OCI_COMPARTMENT_OCID
            OCI_SUBNET_OCID
            SSH_PUBLIC_KEY
          )

          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR:-}" ]; then
              echo "❌ Missing required GitHub Secret: $VAR"
              exit 1
            fi
          done

          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          echo "Testing OCI authentication..."

          oci iam availability-domain list \
            --config-file "$HOME/.oci/config" \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --output json \
            >/dev/null

          echo "✅ OCI authentication OK"

      # ============================================================
      # 3. HUNT
      # ============================================================
      - name: Hunt A1 capacity
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "OCI A1 HUNTER"
          echo "Region: $OCI_REGION"
          echo "Shape: $SHAPE"
          echo ""
          echo "Priority:"
          echo "  1. 1 OCPU / 6 GB"
          echo "  2. 2 OCPU / 12 GB"
          echo "========================================"


          # --------------------------------------------------------
          # Prevent duplicate instance
          # --------------------------------------------------------

          echo ""
          echo "Checking for existing instance..."

          EXISTING_INSTANCE=$(
            oci compute instance list \
              --config-file "$HOME/.oci/config" \
              --region "$OCI_REGION" \
              --compartment-id "$OCI_COMPARTMENT_OCID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json |
            jq -r '
              .data[]
              | select(."lifecycle-state" != "TERMINATED")
              | .id
            ' |
            head -n 1
          )

          if [ -n "$EXISTING_INSTANCE" ]; then
            echo ""
            echo "========================================"
            echo "✅ A1 INSTANCE ALREADY EXISTS"
            echo "Instance: $INSTANCE_NAME"
            echo "OCID: $EXISTING_INSTANCE"
            echo "========================================"
            exit 0
          fi


          # --------------------------------------------------------
          # Find latest compatible Ubuntu ARM image
          # --------------------------------------------------------

          echo ""
          echo "Finding latest compatible Ubuntu ARM image..."

          IMAGE_JSON=$(
            oci compute image list \
              --config-file "$HOME/.oci/config" \
              --region "$OCI_REGION" \
              --compartment-id "$OCI_COMPARTMENT_OCID" \
              --operating-system "Canonical Ubuntu" \
              --shape "$SHAPE" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --all \
              --output json
          )

          IMAGE_ID=$(
            echo "$IMAGE_JSON" |
            jq -r '
              .data
              | map(
                  select(
                    ."operating-system" == "Canonical Ubuntu"
                  )
                )
              | .[0].id // empty
            '
          )

          IMAGE_NAME=$(
            echo "$IMAGE_JSON" |
            jq -r '
              .data
              | map(
                  select(
                    ."operating-system" == "Canonical Ubuntu"
                  )
                )
              | .[0]."display-name" // empty
            '
          )

          if [ -z "$IMAGE_ID" ]; then
            echo "❌ Could not find compatible Ubuntu ARM image."
            exit 1
          fi

          echo "✅ Image:"
          echo "$IMAGE_NAME"
          echo "$IMAGE_ID"


          # --------------------------------------------------------
          # Get Availability Domains
          # --------------------------------------------------------

          echo ""
          echo "Availability Domains:"

          mapfile -t ADS < <(
            oci iam availability-domain list \
              --config-file "$HOME/.oci/config" \
              --region "$OCI_REGION" \
              --compartment-id "$OCI_COMPARTMENT_OCID" \
              --output json |
            jq -r '.data[].name'
          )

          if [ "${#ADS[@]}" -eq 0 ]; then
            echo "❌ No Availability Domains found."
            exit 1
          fi

          printf '  %s\n' "${ADS[@]}"


          # --------------------------------------------------------
          # SSH metadata
          # --------------------------------------------------------

          jq -n \
            --arg ssh "$SSH_PUBLIC_KEY" \
            '{
              ssh_authorized_keys: $ssh
            }' \
            > /tmp/metadata.json


          # --------------------------------------------------------
          # Launch function
          # --------------------------------------------------------

          try_launch() {

            local AD="$1"
            local OCPUS="$2"
            local MEMORY="$3"

            echo ""
            echo "----------------------------------------"
            echo "Trying:"
            echo "$AD"
            echo "$OCPUS OCPU / $MEMORY GB"
            echo "----------------------------------------"

            SHAPE_CONFIG=$(
              jq -cn \
                --argjson ocpus "$OCPUS" \
                --argjson memory "$MEMORY" \
                '{
                  ocpus: $ocpus,
                  memoryInGBs: $memory
                }'
            )

            set +e

            OCI_RESPONSE=$(
              oci compute instance launch \
                --config-file "$HOME/.oci/config" \
                --region "$OCI_REGION" \
                --compartment-id "$OCI_COMPARTMENT_OCID" \
                --availability-domain "$AD" \
                --shape "$SHAPE" \
                --shape-config "$SHAPE_CONFIG" \
                --subnet-id "$OCI_SUBNET_OCID" \
                --image-id "$IMAGE_ID" \
                --display-name "$INSTANCE_NAME" \
                --metadata file:///tmp/metadata.json \
                --assign-public-ip true \
                --output json \
                2>&1
            )

            OCI_EXIT_CODE=$?

            set -e


            # ------------------------------------------------------
            # SUCCESS
            # ------------------------------------------------------

            if [ "$OCI_EXIT_CODE" -eq 0 ]; then

              INSTANCE_ID=$(
                echo "$OCI_RESPONSE" |
                jq -r '.data.id // empty'
              )

              if [ -z "$INSTANCE_ID" ]; then
                echo "❌ OCI returned success but Instance OCID is missing."
                echo "$OCI_RESPONSE"
                exit 1
              fi

              echo ""
              echo "========================================"
              echo "🎉 A1 SERVER CREATED"
              echo "========================================"
              echo "Name:   $INSTANCE_NAME"
              echo "Region: $OCI_REGION"
              echo "AD:     $AD"
              echo "Shape:  $SHAPE"
              echo "CPU:    $OCPUS"
              echo "RAM:    $MEMORY GB"
              echo "OCID:   $INSTANCE_ID"
              echo "========================================"


              # ----------------------------------------------------
              # Telegram notification
              # ----------------------------------------------------

              if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] &&
                 [ -n "${TELEGRAM_CHAT_ID:-}" ]; then

                MESSAGE="🚀 Oracle A1 найден!

✅ Сервер создан

Region: ${OCI_REGION}
AD: ${AD}

CPU: ${OCPUS} OCPU
RAM: ${MEMORY} GB
Shape: ${SHAPE}

Name: ${INSTANCE_NAME}

OCID:
${INSTANCE_ID}"

                curl -fsS \
                  --request POST \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                  --data-urlencode "text=${MESSAGE}" \
                  >/dev/null \
                  || echo "⚠️ Server created, but Telegram notification failed."

                echo "✅ Telegram notification sent."
              else
                echo "ℹ️ Telegram secrets not configured — skipping notification."
              fi


              # ----------------------------------------------------
              # GitHub summary
              # ----------------------------------------------------

              {
                echo "# 🎉 Oracle A1 server created"
                echo ""
                echo "| Parameter | Value |"
                echo "|---|---|"
                echo "| Region | $OCI_REGION |"
                echo "| AD | $AD |"
                echo "| Shape | $SHAPE |"
                echo "| OCPU | $OCPUS |"
                echo "| RAM | $MEMORY GB |"
                echo "| Name | $INSTANCE_NAME |"
                echo "| OCID | \`$INSTANCE_ID\` |"
              } >> "$GITHUB_STEP_SUMMARY"


              return 0
            fi


            # ------------------------------------------------------
            # CAPACITY ERROR = NORMAL
            # ------------------------------------------------------

            if echo "$OCI_RESPONSE" |
              grep -qiE \
              'Out of host capacity|Out of capacity|capacity is not available'
            then

              echo "No capacity in $AD for $OCPUS OCPU / $MEMORY GB."

              return 2
            fi


            # ------------------------------------------------------
            # Any other OCI error = REAL ERROR
            # ------------------------------------------------------

            echo ""
            echo "========================================"
            echo "❌ OCI ERROR"
            echo "========================================"
            echo ""
            echo "$OCI_RESPONSE"
            echo ""
            echo "This is NOT a normal capacity error."
            echo "Hunter stopped so the problem is visible."
            echo ""

            exit 1
          }


          # ========================================================
          # HUNT ORDER
          #
          # Smaller instance first because it has a better chance
          # of fitting into available A1 host capacity.
          # ========================================================

          CONFIGS=(
            "1 6"
            "2 12"
          )

          for CONFIG in "${CONFIGS[@]}"; do

            read -r OCPU MEMORY <<< "$CONFIG"

            for AD in "${ADS[@]}"; do

              set +e
              try_launch "$AD" "$OCPU" "$MEMORY"
              RESULT=$?
              set -e

              if [ "$RESULT" -eq 0 ]; then
                exit 0
              fi

              if [ "$RESULT" -ne 2 ]; then
                echo "❌ Unexpected hunter error."
                exit "$RESULT"
              fi

              sleep 2

            done
          done


          # ========================================================
          # NOTHING FOUND
          # ========================================================

          echo ""
          echo "========================================"
          echo "NO A1 CAPACITY RIGHT NOW"
          echo ""
          echo "Checked:"
          echo ""
          echo "1 OCPU / 6 GB"
          printf '  %s\n' "${ADS[@]}"
          echo ""
          echo "2 OCPU / 12 GB"
          printf '  %s\n' "${ADS[@]}"
          echo ""
          echo "GitHub Actions will retry automatically."
          echo "========================================"

          {
            echo "# A1 capacity unavailable"
            echo ""
            echo "Hunter is working correctly."
            echo ""
            echo "Checked all Availability Domains for:"
            echo ""
            echo "- 1 OCPU / 6 GB"
            echo "- 2 OCPU / 12 GB"
            echo ""
            echo "Next scheduled run will retry automatically."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
