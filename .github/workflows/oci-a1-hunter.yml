name: OCI A1 Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: oci-a1-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTANCE_NAME: designos-a1
      SHAPE: VM.Standard.A1.Flex

    steps:
      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$HOME/oci-cli"
          "$HOME/oci-cli/bin/pip" install --quiet --upgrade pip
          "$HOME/oci-cli/bin/pip" install --quiet oci-cli
          echo "$HOME/oci-cli/bin" >> "$GITHUB_PATH"

      - name: Configure OCI
        shell: bash
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci" "$HOME/.ssh"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"
          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > "$HOME/.ssh/oci_authorized_keys"
          chmod 600 "$HOME/.ssh/oci_authorized_keys"

      - name: Test OCI authentication
        shell: bash
        run: |
          set -euo pipefail
          oci iam region-subscription list \
            --config-file "$HOME/.oci/config" \
            >/dev/null
          echo "OCI authentication OK"

      - name: Hunt Ampere A1
        shell: bash
        run: |
          set -uo pipefail

          send_telegram() {
            local raw="$1"
            local message
            message="$(printf '%b' "$raw")"

            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "Telegram secrets are not configured; notification skipped."
              return 0
            fi

            curl --silent --show-error --fail \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${message}" \
              >/dev/null || true
          }

          echo "========================================"
          echo "OCI A1 HUNTER"
          echo "Region: $OCI_REGION"
          echo "Shape: $SHAPE"
          echo "Primary: 2 OCPU / 12 GB"
          echo "Fallback: 1 OCPU / 6 GB"
          echo "========================================"

          EXISTING="$(
            oci compute instance list \
              --config-file "$HOME/.oci/config" \
              --region "$OCI_REGION" \
              --compartment-id "$OCI_COMPARTMENT_OCID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json 2>/dev/null |
            jq -r '.data[] | select(."lifecycle-state" != "TERMINATED") | .id' |
            head -n 1
          )"

          if [ -n "$EXISTING" ]; then
            echo "A1 already exists: $EXISTING"
            exit 0
          fi

          echo "Finding Ubuntu ARM image..."
          IMAGE_FILE="$(mktemp)"

          if ! oci compute image list \
            --config-file "$HOME/.oci/config" \
            --region "$OCI_REGION" \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --shape "$SHAPE" \
            --operating-system "Canonical Ubuntu" \
            --sort-by TIMECREATED \
            --sort-order DESC \
            --all \
            --output json \
            >"$IMAGE_FILE" 2>&1
          then
            ERROR_TEXT="$(cat "$IMAGE_FILE")"
            rm -f "$IMAGE_FILE"
            echo "$ERROR_TEXT"
            send_telegram "❌ OCI A1 Hunter\nНе удалось получить Ubuntu ARM image.\nRegion: ${OCI_REGION}"
            exit 1
          fi

          IMAGE_ID="$(
            jq -r '[.data[] | select(."lifecycle-state" == "AVAILABLE")][0].id // empty' "$IMAGE_FILE"
          )"
          rm -f "$IMAGE_FILE"

          if [ -z "$IMAGE_ID" ]; then
            echo "Compatible Ubuntu ARM image not found."
            send_telegram "❌ OCI A1 Hunter\nUbuntu ARM image не найден.\nRegion: ${OCI_REGION}"
            exit 1
          fi

          echo "Image found: $IMAGE_ID"

          AD_FILE="$(mktemp)"
          if ! oci iam availability-domain list \
            --config-file "$HOME/.oci/config" \
            --region "$OCI_REGION" \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --output json \
            >"$AD_FILE" 2>&1
          then
            ERROR_TEXT="$(cat "$AD_FILE")"
            rm -f "$AD_FILE"
            echo "$ERROR_TEXT"
            send_telegram "❌ OCI A1 Hunter\nНе удалось получить Availability Domains.\nRegion: ${OCI_REGION}"
            exit 1
          fi

          mapfile -t ADS < <(jq -r '.data[].name' "$AD_FILE")
          rm -f "$AD_FILE"

          if [ "${#ADS[@]}" -eq 0 ]; then
            echo "No Availability Domains found."
            send_telegram "❌ OCI A1 Hunter\nAvailability Domains не найдены.\nRegion: ${OCI_REGION}"
            exit 1
          fi

          echo "Availability Domains:"
          printf '  %s\n' "${ADS[@]}"

          CONFIGS=("2:12" "1:6")

          for CONFIG in "${CONFIGS[@]}"; do
            IFS=: read -r OCPUS MEMORY <<<"$CONFIG"

            for AD in "${ADS[@]}"; do
              echo
              echo "----------------------------------------"
              echo "Trying: $AD"
              echo "${OCPUS} OCPU / ${MEMORY} GB"
              echo "----------------------------------------"

              OUTPUT_FILE="$(mktemp)"

              if oci compute instance launch \
                --config-file "$HOME/.oci/config" \
                --region "$OCI_REGION" \
                --availability-domain "$AD" \
                --compartment-id "$OCI_COMPARTMENT_OCID" \
                --subnet-id "$OCI_SUBNET_OCID" \
                --shape "$SHAPE" \
                --shape-config "{\"ocpus\":${OCPUS},\"memoryInGBs\":${MEMORY}}" \
                --display-name "$INSTANCE_NAME" \
                --image-id "$IMAGE_ID" \
                --ssh-authorized-keys-file "$HOME/.ssh/oci_authorized_keys" \
                --assign-public-ip true \
                --boot-volume-size-in-gbs 50 \
                --wait-for-state RUNNING \
                --wait-interval-seconds 15 \
                --no-retry \
                --output json \
                >"$OUTPUT_FILE" 2>&1
              then
                EXIT_CODE=0
              else
                EXIT_CODE=$?
              fi

              if [ "$EXIT_CODE" -eq 0 ]; then
                INSTANCE_ID="$(jq -r '.data.id // empty' "$OUTPUT_FILE" 2>/dev/null)"
                rm -f "$OUTPUT_FILE"

                PUBLIC_IP="unknown"
                sleep 5
                VNIC_FILE="$(mktemp)"

                if oci compute instance list-vnics \
                  --config-file "$HOME/.oci/config" \
                  --region "$OCI_REGION" \
                  --instance-id "$INSTANCE_ID" \
                  --output json \
                  >"$VNIC_FILE" 2>/dev/null
                then
                  PUBLIC_IP="$(jq -r '.data[0]."public-ip" // "unknown"' "$VNIC_FILE")"
                fi
                rm -f "$VNIC_FILE"

                echo "========================================"
                echo "A1 FOUND AND CREATED"
                echo "AD: $AD"
                echo "CPU: $OCPUS OCPU"
                echo "RAM: $MEMORY GB"
                echo "Public IP: $PUBLIC_IP"
                echo "Instance: $INSTANCE_ID"
                echo "========================================"

                send_telegram "🔥 ORACLE A1 ПОЙМАН!\n\n🖥 DesignOS Server\n📍 Region: ${OCI_REGION}\n🏢 AD: ${AD}\n⚙️ CPU: ${OCPUS} OCPU\n🧠 RAM: ${MEMORY} GB\n🌐 Public IP: ${PUBLIC_IP}\n\n✅ Instance создан автоматически."
                exit 0
              fi

              ERROR_TEXT="$(cat "$OUTPUT_FILE")"
              rm -f "$OUTPUT_FILE"

              echo "OCI response:"
              echo "$ERROR_TEXT" | tail -n 30

              if echo "$ERROR_TEXT" | grep -Eqi 'Out of host capacity|OutOfHostCapacity|out of capacity|InsufficientHostCapacity'; then
                echo "No capacity in $AD"
                continue
              fi

              if echo "$ERROR_TEXT" | grep -Eqi 'LimitExceeded|QuotaExceeded|ServiceLimit|service limit'; then
                send_telegram "⚠️ OCI A1 Hunter\nService / Quota Limit.\nRegion: ${OCI_REGION}\nAD: ${AD}\nConfig: ${OCPUS} OCPU / ${MEMORY} GB"
                exit 1
              fi

              if echo "$ERROR_TEXT" | grep -Eqi 'NotAuthenticated|InvalidKey|InvalidPrivateKey|InvalidFingerprint'; then
                send_telegram "❌ OCI A1 Hunter\nОшибка API authentication.\nПроверь User OCID, Tenancy OCID, Fingerprint и Private API Key."
                exit 1
              fi

              if echo "$ERROR_TEXT" | grep -Eqi 'NotAuthorized|Authorization failed|Forbidden'; then
                send_telegram "❌ OCI A1 Hunter\nНедостаточно прав OCI.\nПроверь IAM permissions."
                exit 1
              fi

              if echo "$ERROR_TEXT" | grep -Eqi 'InvalidParameter|InvalidSubnet|NotFound|InvalidImage'; then
                send_telegram "❌ OCI A1 Hunter\nОшибка конфигурации OCI.\nAD: ${AD}\nПроверь Subnet, Compartment, Region и Image."
                exit 1
              fi

              echo "Unknown or temporary OCI error; trying next AD."
            done
          done

          echo "========================================"
          echo "NO A1 CAPACITY RIGHT NOW"
          echo "Checked all ADs for 2 OCPU / 12 GB and 1 OCPU / 6 GB."
          echo "GitHub will retry automatically."
          echo "========================================"
          exit 0
